name: Deploy dashboard a GitHub Pages

on:
  push:
    branches: [main]
    paths: ['pages-ui/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Subir artefacto (pages-ui)
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'pages-ui'
      - name: Desplegar a Pages
        id: deployment
        uses: actions/deploy-pages@v4
