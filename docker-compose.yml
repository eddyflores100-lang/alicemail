# AliceMail (ALICE) — despliegue en tu VM Oracle Always Free (ARM)
#
#   bash deploy/install.sh     ← instala todo automáticamente
#   # o manualmente:
#   mkdir -p alicemail-db && docker compose up -d --build
#
# Panel local: ssh -L 3000:localhost:3000 alicelabs-free → http://localhost:3000
# Dashboard público: https://eddyflores100-lang.github.io/alicemail/
services:
  alicemail:
    build: .
    container_name: alicemail
    restart: unless-stopped
    # Solo localhost: el exterior NO alcanza la VM (toda la comunicación
    # con GitHub/Telegram es saliente). Acceso por túnel SSH.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: file:/app/db/custom.db
      # Puente GitHub ↔ VM (tomados de .env junto a este archivo)
      GH_SYNC_TOKEN: ${GH_SYNC_TOKEN:-}
      GH_DATA_REPO: ${GH_DATA_REPO:-}
      GH_SYNC_BRANCH: ${GH_SYNC_BRANCH:-main}
      GH_SYNC_MASK_EMAILS: ${GH_SYNC_MASK_EMAILS:-true}
    volumes:
      - ./alicemail-db:/app/db   # la base de datos SQLite sobrevive a reinicios
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/stats').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 90s
